<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周边定制 · 商品目录</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1>周边定制 · 商品目录</h1>
        <p class="subtitle" id="subtitle">数据加载中…</p>
      </div>
      <div class="search-box">
        <input type="search" id="search" placeholder="搜索全部商品…" autocomplete="off" />
      </div>
    </div>
  </header>

  <nav class="filter-bar">
    <!-- 一级分类 -->
    <div class="filter-group">
      <div class="filter-label"><span class="fl-dot lv1"></span>一级分类</div>
      <div class="chips lv1-chips" id="lv1Chips"></div>
    </div>
    <!-- 二级分类：缩进 + 引导线，明确是从属层 -->
    <div class="filter-group sub" id="lv2Group" hidden>
      <div class="filter-label"><span class="fl-branch">└─</span><span id="lv2Label">二级分类</span></div>
      <div class="chips lv2-chips" id="lv2Chips"></div>
    </div>
  </nav>

  <main class="container">
    <div class="result-meta" id="resultMeta"></div>
    <section class="grid" id="grid"></section>
    <div class="more-wrap" id="moreWrap" hidden>
      <button type="button" class="more-btn" id="moreBtn">加载更多</button>
    </div>
    <div class="empty" id="empty" hidden>没有匹配的商品</div>
  </main>

  <footer class="site-footer">
    <p>本页面为手动整理的商品目录，图片与价格仅供参考；价格以实际下单为准。</p>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
